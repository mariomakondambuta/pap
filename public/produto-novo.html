<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar produto — EduWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="app-topbar-left">
        <a href="/painel.html?mode=vender&tab=produtos" class="app-topbar-back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar
        </a>
      </div>
      <div class="app-topbar-right">
        <div class="avatar" id="account-avatar"></div>
        <button class="app-icon-btn" id="btn-logout" aria-label="Sair">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="app-main" style="max-width:960px; margin:0 auto;">
      <div class="page-header-flat">
        <h1>O que vai vender?</h1>
        <p>Escolha o formato do seu produto. Poderá editar todos os detalhes a seguir.</p>
      </div>

      <div class="type-picker-grid" id="type-picker-grid"></div>
    </main>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/app-shell.js"></script>
  <script src="/js/product-card.js"></script>
  <script src="/js/produto-novo.js"></script>
</body>
</html>
