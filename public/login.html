<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — EduWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container flex-between">
      <a href="/index.html" class="logo">Edu<span>Web</span></a>
      <ul class="nav-links" id="nav-links">
        <li><a href="/index.html">Início</a></li>
        <li><a href="/cursos.html">Cursos</a></li>
        <li><a href="/verificar.html">Verificar Certificado</a></li>
      </ul>
      <div class="flex gap-md" id="nav-actions"></div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu">☰</button>
    </div>
  </nav>

  <div class="container">
    <div class="card auth-card">
      <h2 class="text-center">Aceder à sua conta</h2>
      <p class="text-center">Entre para continuar a sua aprendizagem.</p>

      <div class="alert alert-error" id="alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Entrar</button>
      </form>

      <p class="auth-switch">Ainda não tem conta? <a href="/registar.html">Registe-se gratuitamente</a></p>
      <p class="auth-switch muted" style="font-size:0.8rem;">Conta de administrador de demonstração: admin@eduweb.com / admin123</p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
