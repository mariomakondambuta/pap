<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — EduWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container flex-between">
      <a href="/index.html" class="logo">Edu<span>Web</span></a>
      <ul class="nav-links" id="nav-links">
        <li><a href="/index.html">Início</a></li>
        <li><a href="/cursos.html">Explorar</a></li>
        <li><a href="/verificar.html">Verificar Certificado</a></li>
      </ul>
      <div class="flex gap-md" id="nav-actions"></div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </nav>

  <div class="container">
    <div class="card auth-card">
      <h2 class="text-center">Criar a sua conta</h2>
      <p class="text-center">Grátis e demora menos de um minuto.</p>

      <div class="alert alert-error" id="alert-error"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Nome completo</label>
          <input type="text" id="name" name="name" required autocomplete="name" placeholder="O seu nome" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Criar conta</button>
      </form>

      <p class="auth-switch">Já tem conta? <a href="/login.html">Entrar</a></p>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/registar.js"></script>
</body>
</html>
