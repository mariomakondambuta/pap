<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar produto — EduWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="app-topbar-left">
        <a href="/painel.html?mode=vender&tab=produtos" class="app-topbar-back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Voltar
        </a>
      </div>
      <div class="app-topbar-right">
        <div class="avatar" id="account-avatar"></div>
        <button class="app-icon-btn" id="btn-logout" aria-label="Sair">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="app-main" style="max-width:1080px; margin:0 auto;">
      <div class="page-header-flat flex-between" style="flex-wrap:wrap; gap:12px;">
        <div>
          <h1 id="editor-title">Novo produto</h1>
          <p id="editor-subtitle">Preencha os detalhes e grave para publicar.</p>
        </div>
        <button class="btn btn-primary" id="btn-save" form="product-form">Guardar produto</button>
      </div>

      <div class="alert alert-error" id="form-error"></div>

      <form id="product-form">
        <div class="editor-layout">
          <div class="editor-main">
            <div class="card">
              <h3>Detalhes</h3>
              <div class="form-group">
                <label for="product-title">Título</label>
                <input type="text" id="product-title" required placeholder="Ex: Guia completo de marketing digital" />
              </div>
              <div class="form-group">
                <label for="product-description">Descrição</label>
                <textarea id="product-description" rows="6" placeholder="Descreva o que o comprador vai encontrar neste produto..."></textarea>
              </div>
            </div>

            <div class="card">
              <h3>Imagem de capa</h3>
              <div class="form-group">
                <label for="product-thumbnail">URL da imagem (opcional)</label>
                <input type="url" id="product-thumbnail" placeholder="https://..." />
              </div>
              <div class="media-preview" id="thumbnail-preview"></div>
            </div>

            <div class="card">
              <h3>Preço</h3>
              <div class="form-group">
                <label for="product-price">Preço em € (0 para gratuito)</label>
                <input type="number" id="product-price" min="0" step="0.01" value="0" />
              </div>
            </div>

            <div class="card" id="contents-card">
              <div class="flex-between" style="margin-bottom:12px;">
                <h3 style="margin-bottom:0;">Conteúdos do produto</h3>
                <button type="button" class="btn btn-outline btn-sm" id="btn-manage-contents">Gerir conteúdos</button>
              </div>
              <p class="muted" id="contents-hint">Grave o produto primeiro para poder adicionar vídeos, PDFs ou ficheiros.</p>
              <ul class="lesson-list" id="contents-preview"></ul>
            </div>
          </div>

          <div class="editor-side">
            <div class="card">
              <h3>Estado</h3>
              <div class="form-group" style="margin-bottom:0;">
                <label for="product-published">Visibilidade</label>
                <select id="product-published">
                  <option value="0">Rascunho</option>
                  <option value="1">Publicado</option>
                </select>
              </div>
            </div>

            <div class="card">
              <h3>Organização</h3>
              <div class="form-group">
                <label for="product-format">Formato</label>
                <select id="product-format">
                  <option value="curso">Curso (vídeo-aulas)</option>
                  <option value="ebook">E-book</option>
                  <option value="planilha">Planilha</option>
                  <option value="template">Template</option>
                  <option value="pack">Pack</option>
                  <option value="outro">Outro</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label for="product-category">Categoria</label>
                <input type="text" id="product-category" placeholder="Ex: Marketing" />
              </div>
            </div>

            <div class="card" id="stats-card" hidden>
              <h3>Estatísticas</h3>
              <div class="flex-between" style="margin-bottom:10px;">
                <span class="muted">Conteúdos</span>
                <strong id="stat-lessons">0</strong>
              </div>
              <div class="flex-between" style="margin-bottom:0;">
                <span class="muted">Alunos</span>
                <strong id="stat-students">0</strong>
              </div>
            </div>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/app-shell.js"></script>
  <script src="/js/product-card.js"></script>
  <script src="/js/modal-utils.js"></script>
  <script src="/js/content-manager.js"></script>
  <script src="/js/produto-editar.js"></script>
</body>
</html>
